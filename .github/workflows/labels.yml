name: Labels

# Creates upstream's labels in this repository (sandbox/sync_labels.py). Run it by hand after an import.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or update labels
        run: python3 sandbox/sync_labels.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
