name: Checks

on:
  push:
    # eval/<case> branches carry an older upstream copy for one golden case (evals/golden/case_branch.py)
    branches-ignore: ['eval/**']
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate the metric outputs
        run: |
          python3 evals/metrics/compute_metrics.py > /dev/null
          python3 evals/metrics/crosscheck_metrics.py > /dev/null

      - name: Committed outputs match what the scripts produce
        run: git diff --exit-code -- evals/metrics

      - name: Every number in the docs is backed by an output
        run: python3 verification/check_claims.py

      - name: DESIGN.md stays within 150 lines, with normal line lengths
        run: |
          test "$(wc -l < DESIGN.md)" -le 150 || { echo "DESIGN.md has $(wc -l < DESIGN.md) lines"; exit 1; }
          awk '!/^\|/ && length > 120 { print "DESIGN.md:" NR " has " length " characters"; bad = 1 } END { exit bad }' DESIGN.md

      - name: The issue snapshot matches its manifest
        run: sha256sum -c evals/data/snapshot.sha256 --quiet

      - name: Imported upstream files match the manifest
        run: sha256sum -c sandbox/upstream.sha256 --quiet

      - name: Imported upstream files match a fresh import of the pinned commit
        run: |
          sandbox/import_upstream.sh
          test -z "$(git status --porcelain)" || { git status --short | head -20; exit 1; }

      - name: Label parser tests
        run: |
          python3 -m unittest discover -s sandbox
          python3 sandbox/sync_labels.py --list > /dev/null

      - name: Triage script tests
        run: python3 -m unittest discover -s .claude/skills/issue-triage/tests

      - name: Golden-case and scorer tests
        run: python3 -m unittest discover -s evals/golden

      - name: The live run's results regenerate unchanged from its collected runs
        run: |
          python3 evals/golden/score.py 2026-10-28 > /dev/null
          git diff --exit-code -- evals/golden/results-2026-10-28.md

      - name: Every collected run rebuilds unchanged from its committed job logs
        run: |
          for d in evals/golden/actual/2026-10-28/logs/*/; do
            python3 evals/golden/collect_run.py 2026-10-28 "$(basename "$d")" "$d/agent.log" "$d/detection.log" "$d/issue.json" > /dev/null
          done
          git diff --exit-code -- evals/golden/actual

      - name: The agent is configured as the golden set last ran it
        run: sha256sum -c evals/golden/tested-config.sha256 --quiet

      - name: The held-out draw, every case input and the check replay regenerate unchanged from the data and upstream's history
        run: |
          git init -q ../upstream && git -C ../upstream fetch -q --filter=tree:0 https://github.com/hashicorp/terraform-provider-aws main
          python3 evals/golden/select_cases.py > /dev/null
          python3 evals/golden/build_cases.py ../upstream > /dev/null
          python3 evals/golden/replay_checks.py ../upstream > /dev/null
          test -z "$(git status --porcelain)" || { git status --short | head -20; exit 1; }

      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@40fb427c047bb9f77324054adeb574e04c9481aa # v0.93.4
        with:
          version: v0.93.4

      - name: gh-aw's runtime actions are pinned to the commit of its release tag
        run: |
          pinned=$(grep -o '"sha": "[0-9a-f]\{40\}"' .github/aw/actions-lock.json | cut -d'"' -f4)
          tagged=$(git ls-remote https://github.com/github/gh-aw-actions 'refs/tags/v0.93.4^{}' | cut -f1)
          test -n "$pinned" && test "$pinned" = "$tagged" || { echo "pinned $pinned, tag v0.93.4 is $tagged"; exit 1; }

      - name: The agent's lock file matches a fresh compile of its workflow
        run: |
          gh aw compile issue-triage
          test -z "$(git status --porcelain)" || { git status --short; git diff | head -40; exit 1; }

      - name: The kill-switch label exists, so the agent can be paused at once
        run: gh api "repos/$GITHUB_REPOSITORY/labels/triage-agent-paused" --silent
        env:
          GH_TOKEN: ${{ github.token }}

      - name: No credentials are committed
        run: "! git grep -nIE 'sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}'"
